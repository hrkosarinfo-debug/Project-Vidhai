<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOREDOO · HRMS – Single Slide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f9;
        }

        .dashboard {
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            max-height: 100dvh;
            background: #ffffff;
            padding: 12px 20px 14px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        /* ── Header ── */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-bottom: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #0b2b5c, #1a3f7a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.5px;
        }

        .brand h1 {
            font-size: 17px;
            font-weight: 700;
            color: #0b2b5c;
            letter-spacing: -0.3px;
        }
        .brand h1 span {
            font-weight: 400;
            color: #4a6a8f;
        }

        .badge-date {
            background: #e8edf4;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            color: #1a3f7a;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-date .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #2b8c5e;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* ── Section labels ── */
        .section-labels {
            display: flex;
            gap: 20px;
            flex-shrink: 0;
            margin-bottom: 6px;
            font-size: 10.5px;
            font-weight: 600;
            color: #4a6a8f;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .section-labels .label-critical {
            color: #b13e3a;
        }
        .section-labels .label-activity {
            color: #1a5a8c;
        }
        .section-labels .count {
            background: #eef3f9;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 9.5px;
            font-weight: 600;
            color: #1a3f7a;
            margin-left: 4px;
        }

        /* ── Single grid – all items visible at once ── */
        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 7px;
            min-height: 0;
        }

        /* ── Card ── */
        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 9px 13px;
            border: 1px solid #eaf0f6;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: #cbdae7;
        }
        .card.critical {
            border-left: 3px solid #b13e3a;
        }
        .card.activity {
            border-left: 3px solid #1a5a8c;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 1px;
        }

        .card-id {
            font-weight: 700;
            font-size: 12px;
            color: #0b2b5c;
            text-decoration: none;
            display: inline-block;
        }
        .card-id:hover {
            text-decoration: underline;
        }

        .card-badge {
            font-size: 7px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 1px 8px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .badge-critical {
            background: #fee9e7;
            color: #b13e3a;
        }
        .badge-activity {
            background: #e3edfb;
            color: #1a5a8c;
        }

        .card-summary {
            font-size: 11px;
            color: #1a2e44;
            line-height: 1.3;
            font-weight: 500;
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 4px 8px;
            font-size: 9.5px;
            color: #4a6a8f;
            padding-top: 4px;
            border-top: 1px solid #f0f4f9;
            margin-top: 3px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .card-footer .label {
            font-weight: 600;
            color: #0b2b5c;
        }
        .card-footer .detail-text {
            color: #1a3f7a;
        }
        .card-footer .status-tag {
            background: #eef3f9;
            padding: 0 8px;
            border-radius: 30px;
            font-size: 8px;
            line-height: 16px;
            color: #1a3f7a;
            font-weight: 600;
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ── Empty placeholder (invisible) ── */
        .card-empty {
            visibility: hidden;
            border-color: transparent;
            box-shadow: none;
            pointer-events: none;
        }
        .card-empty:hover {
            border-color: transparent;
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            .dashboard {
                padding: 10px 14px 12px;
            }
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(4, 1fr);
                gap: 6px;
            }
            .brand h1 {
                font-size: 15px;
            }
            .card {
                padding: 7px 10px;
            }
            .card-summary {
                font-size: 10.5px;
                -webkit-line-clamp: 2;
            }
            .card-footer {
                font-size: 9px;
            }
            .card-id {
                font-size: 11px;
            }
            .section-labels {
                font-size: 10px;
                gap: 14px;
            }
        }

        @media (max-width: 480px) {
            .dashboard {
                padding: 6px 8px 8px;
            }
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(7, 1fr);
                gap: 5px;
            }
            .brand h1 {
                font-size: 13px;
            }
            .card {
                padding: 5px 8px;
                border-radius: 8px;
            }
            .card-summary {
                font-size: 9.5px;
                -webkit-line-clamp: 2;
            }
            .card-footer {
                font-size: 8.5px;
                padding-top: 2px;
            }
            .card-id {
                font-size: 9.5px;
            }
            .card-footer .status-tag {
                font-size: 7px;
                line-height: 13px;
                padding: 0 5px;
            }
            .section-labels {
                font-size: 8.5px;
                gap: 8px;
                margin-bottom: 4px;
            }
            .badge-date {
                font-size: 9px;
                padding: 2px 8px;
            }
            .brand-icon {
                width: 24px;
                height: 24px;
                font-size: 11px;
            }
            .card-badge {
                font-size: 6px;
                padding: 0 5px;
            }
        }

        .page-note {
            flex-shrink: 0;
            text-align: center;
            font-size: 9px;
            color: #8aa3c0;
            padding-top: 5px;
            border-top: 1px solid #eaf0f6;
            margin-top: 5px;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="dashboard-header">
            <div class="brand">
                <div class="brand-icon">O</div>
                <h1>OOREDOO <span>· HRMS</span></h1>
            </div>
            <div class="badge-date">
                <span class="dot"></span>
                <span><span id="currentDate"></span></span>
            </div>
        </header>

        <!-- Section labels -->
        <div class="section-labels">
            <span class="label-critical">🚨 Critical &amp; Blocking Items <span class="count" id="criticalCount">4</span></span>
            <span class="label-activity">📋 Recent Activity &amp; Updates <span class="count" id="activityCount">3</span></span>
        </div>

        <!-- Single grid – all 7 items visible at once -->
        <div class="grid-container" id="gridContainer">
            <!-- injected by JS -->
        </div>

        <div class="page-note">All critical blockers &amp; recent updates · one‑slide snapshot</div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DATA – all 7 items
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const items = [{
            id: 'OH-185',
            type: 'critical',
            summary: 'Escalated to Highest priority by Prabhu Rama Swamy.',
            status: 'Highest Priority',
            detail: 'Escalated by Prabhu Rama Swamy'
        }, {
            id: 'OH-140 & OH-141',
            type: 'critical',
            summary: 'Leave Approver Errors: GetLeaveApproversAll throws ORA-20001 (permission leave >4hrs) and ORA-20999 (missing event name/location).',
            status: 'Blocked',
            detail: 'PL/SQL errors blocking testing'
        }, {
            id: 'OH-173',
            type: 'critical',
            summary: 'AME Routing Testing: CSR leave workflow display errors, Permission & Local Event leaves also erroring.',
            status: 'Error',
            detail: 'Abhijeet reported errors'
        }, {
            id: 'OH-183',
            type: 'critical',
            summary: 'Procedure Consistency: p_email and p_username missing from updated procedure; align with unified standards.',
            status: 'In Progress',
            detail: 'Surender flagged missing params'
        }, {
            id: 'OH-186, OH-187, OH-188',
            type: 'activity',
            summary: 'New Mobile App Issues: Leaves from app not displaying in history, stuck in pending, missing approver details.',
            status: 'New',
            detail: 'Assigned to Kumar'
        }, {
            id: 'OH-181 & OH-182',
            type: 'activity',
            summary: 'Workflow Attachments & Timeouts: Updated getleaverequests to expose p_document_id, p_document_ids, and notify_teammates.',
            status: 'Updated',
            detail: 'Sprint/rank updated'
        }, {
            id: 'OH-178',
            type: 'activity',
            summary: 'Dependent Creation & Approval: Validated by Abhijeet; creation-to-approval under 10 sec after optimization.',
            status: 'Verified',
            detail: 'Working – confirmed by Abhijeet'
        }];

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER – all items in one grid
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const grid = document.getElementById('gridContainer');

        function renderCard(item) {
            const typeClass = item.type === 'critical' ? 'critical' : 'activity';
            const badgeClass = item.type === 'critical' ? 'badge-critical' : 'badge-activity';
            const badgeLabel = item.type === 'critical' ? 'Critical' : 'Activity';
            const linkId = item.id.split(' & ')[0].split(',')[0].trim();
            return `
            <div class="card ${typeClass}">
              <div class="card-top">
                <a href="https://deepdomain.atlassian.net/browse/${linkId}" target="_blank" class="card-id">${item.id}</a>
                <span class="card-badge ${badgeClass}">${badgeLabel}</span>
              </div>
              <div class="card-summary">${item.summary}</div>
              <div class="card-footer">
                <span class="label">Action</span>
                <span class="detail-text">${item.detail}</span>
                <span class="status-tag">${item.status}</span>
              </div>
            </div>
          `;
        }

        // Counts
        const criticalCount = items.filter(i => i.type === 'critical').length;
        const activityCount = items.filter(i => i.type === 'activity').length;
        document.getElementById('criticalCount').textContent = criticalCount;
        document.getElementById('activityCount').textContent = activityCount;

        // Render all 7 items
        grid.innerHTML = items.map(renderCard).join('');

        // Fill remaining cells to maintain grid symmetry (9 cells total)
        // 3×3 = 9 cells, we have 7 items → 2 empty placeholders
        const totalCells = grid.children.length; // 7
        const targetCells = 9;
        for (let i = totalCells; i < targetCells; i++) {
            const empty = document.createElement('div');
            empty.className = 'card card-empty';
            grid.appendChild(empty);
        }

        // ── set current date ──
        const now = new Date();
        document.getElementById('currentDate').textContent =
            now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

        console.log('✅ Single‑slide grid ready – all 7 items visible at once');
    </script>

</body>
</html>
