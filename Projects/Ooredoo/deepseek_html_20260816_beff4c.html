<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOREDOO · HRMS – Slider Overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f9;
        }

        .dashboard {
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            max-height: 100dvh;
            background: #ffffff;
            padding: 12px 20px 14px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        /* ── Header ── */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-bottom: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(145deg, #0b2b5c, #1a3f7a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.5px;
        }

        .brand h1 {
            font-size: 17px;
            font-weight: 700;
            color: #0b2b5c;
            letter-spacing: -0.3px;
        }
        .brand h1 span {
            font-weight: 400;
            color: #4a6a8f;
        }

        .badge-date {
            background: #e8edf4;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            color: #1a3f7a;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-date .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #2b8c5e;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* ── Slider section ── */
        .slider-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        .section-head h2 {
            font-size: 14px;
            font-weight: 600;
            color: #0b2b5c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-head h2 .count-badge {
            background: #dce4ee;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: #1a3f7a;
        }

        .section-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .section-controls button {
            background: #f0f4f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 15px;
            color: #1a3f7a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .section-controls button:hover {
            background: #dce4ee;
        }
        .section-controls button:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .slide-counter {
            font-size: 11px;
            color: #4a6a8f;
            font-weight: 500;
            margin-right: 2px;
        }

        /* ── Track ── */
        .slider-track-wrap {
            flex: 1;
            overflow: hidden;
            border-radius: 12px;
            min-height: 0;
        }

        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .slider-slide {
            flex: 0 0 100%;
            height: 100%;
            padding: 2px 0;
        }

        .card-grid {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
            height: 100%;
        }

        /* ── Card ── */
        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 9px 13px;
            border: 1px solid #eaf0f6;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: #cbdae7;
        }
        .card.critical {
            border-left: 3px solid #b13e3a;
        }
        .card.activity {
            border-left: 3px solid #1a5a8c;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 1px;
        }

        .card-id {
            font-weight: 700;
            font-size: 12px;
            color: #0b2b5c;
            text-decoration: none;
            display: inline-block;
        }
        .card-id:hover {
            text-decoration: underline;
        }

        .card-badge {
            font-size: 7px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 1px 8px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .badge-critical {
            background: #fee9e7;
            color: #b13e3a;
        }
        .badge-activity {
            background: #e3edfb;
            color: #1a5a8c;
        }

        .card-summary {
            font-size: 11px;
            color: #1a2e44;
            line-height: 1.3;
            font-weight: 500;
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 4px 8px;
            font-size: 9.5px;
            color: #4a6a8f;
            padding-top: 4px;
            border-top: 1px solid #f0f4f9;
            margin-top: 3px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .card-footer .label {
            font-weight: 600;
            color: #0b2b5c;
        }
        .card-footer .detail-text {
            color: #1a3f7a;
        }
        .card-footer .status-tag {
            background: #eef3f9;
            padding: 0 8px;
            border-radius: 30px;
            font-size: 8px;
            line-height: 16px;
            color: #1a3f7a;
            font-weight: 600;
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ── Dots ── */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-shrink: 0;
            padding-top: 8px;
        }
        .slider-dots button {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: none;
            background: #d0dbe8;
            cursor: pointer;
            padding: 0;
            transition: background 0.25s, transform 0.2s;
        }
        .slider-dots button.active {
            background: #1a3f7a;
            transform: scale(1.3);
        }
        .slider-dots button:hover {
            background: #8aa3c0;
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            .dashboard {
                padding: 10px 14px 12px;
            }
            .card-grid {
                grid-template-rows: 1fr 1fr;
            }
            .brand h1 {
                font-size: 15px;
            }
            .card {
                padding: 7px 10px;
            }
            .card-summary {
                font-size: 10.5px;
                -webkit-line-clamp: 2;
            }
            .card-footer {
                font-size: 9px;
            }
            .card-id {
                font-size: 11px;
            }
            .section-head h2 {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .dashboard {
                padding: 6px 8px 8px;
            }
            .card-grid {
                grid-template-rows: 1fr 1fr;
            }
            .brand h1 {
                font-size: 13px;
            }
            .card {
                padding: 5px 8px;
                border-radius: 8px;
            }
            .card-summary {
                font-size: 9.5px;
                -webkit-line-clamp: 2;
            }
            .card-footer {
                font-size: 8.5px;
                padding-top: 2px;
            }
            .card-id {
                font-size: 9.5px;
            }
            .card-footer .status-tag {
                font-size: 7px;
                line-height: 13px;
                padding: 0 5px;
            }
            .section-head h2 {
                font-size: 11px;
            }
            .slide-counter {
                font-size: 9px;
            }
            .section-controls button {
                width: 24px;
                height: 24px;
                font-size: 13px;
            }
            .badge-date {
                font-size: 9px;
                padding: 2px 8px;
            }
            .brand-icon {
                width: 24px;
                height: 24px;
                font-size: 11px;
            }
            .card-badge {
                font-size: 6px;
                padding: 0 5px;
            }
        }

        .page-note {
            flex-shrink: 0;
            text-align: center;
            font-size: 9px;
            color: #8aa3c0;
            padding-top: 5px;
            border-top: 1px solid #eaf0f6;
            margin-top: 5px;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="dashboard-header">
            <div class="brand">
                <div class="brand-icon">O</div>
                <h1>OOREDOO <span>· HRMS</span></h1>
            </div>
            <div class="badge-date">
                <span class="dot"></span>
                <span><span id="currentDate"></span></span>
            </div>
        </header>

        <!-- Slider -->
        <section class="slider-section">
            <div class="section-head">
                <h2>
                    📋 Board Updates
                    <span class="count-badge" id="totalCount">7</span>
                </h2>
                <div class="section-controls">
                    <span class="slide-counter" id="slideCounter">1 / 3</span>
                    <button id="prevBtn" aria-label="Previous">‹</button>
                    <button id="nextBtn" aria-label="Next">›</button>
                </div>
            </div>

            <div class="slider-track-wrap">
                <div class="slider-track" id="sliderTrack">
                    <!-- injected -->
                </div>
            </div>

            <div class="slider-dots" id="sliderDots"></div>
        </section>

        <div class="page-note">All critical blockers &amp; recent updates · slider overview</div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DATA – from the latest briefing
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const allItems = [{
            id: 'OH-185',
            type: 'critical',
            summary: 'Escalated to Highest priority by Prabhu Rama Swamy.',
            status: 'Highest Priority',
            detail: 'Escalated by Prabhu Rama Swamy'
        }, {
            id: 'OH-140 & OH-141',
            type: 'critical',
            summary: 'Leave Approver Errors: Testing blocked. GetLeaveApproversAll throws ORA-20001 (permission leave >4hrs) and ORA-20999 (missing event name/location).',
            status: 'Blocked',
            detail: 'PL/SQL errors – blocking testing'
        }, {
            id: 'OH-173',
            type: 'critical',
            summary: 'AME Routing Testing: CSR leave workflow display errors, Permission & Local Event leaves also erroring.',
            status: 'Error',
            detail: 'Abhijeet reported errors'
        }, {
            id: 'OH-183',
            type: 'critical',
            summary: 'Procedure Consistency: p_email and p_username missing from updated procedure; request to align with unified standards.',
            status: 'In Progress',
            detail: 'Surender flagged missing params'
        }, {
            id: 'OH-186, OH-187, OH-188',
            type: 'activity',
            summary: 'New Mobile App Issues: Leaves from app not displaying in history, stuck in pending, missing approver details.',
            status: 'New',
            detail: 'Assigned to Kumar'
        }, {
            id: 'OH-181 & OH-182',
            type: 'activity',
            summary: 'Workflow Attachments & Timeouts: Updated getleaverequests to expose p_document_id, p_document_ids, and notify_teammates.',
            status: 'Updated',
            detail: 'Sprint/rank updated'
        }, {
            id: 'OH-178',
            type: 'activity',
            summary: 'Dependent Creation & Approval: Validated by Abhijeet; creation-to-approval under 10 sec after backend optimization.',
            status: 'Verified',
            detail: 'Working – confirmed by Abhijeet'
        }];

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SLIDER ENGINE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const track = document.getElementById('sliderTrack');
        const dotsContainer = document.getElementById('sliderDots');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counterEl = document.getElementById('slideCounter');
        const totalCountEl = document.getElementById('totalCount');

        let currentIndex = 0;
        let slides = [];
        let itemsPerSlide = 3;

        function getItemsPerSlide() {
            const w = window.innerWidth;
            if (w < 480) return 2;
            return 3;
        }

        function chunkArray(arr, size) {
            const chunks = [];
            for (let i = 0; i < arr.length; i += size) {
                chunks.push(arr.slice(i, i + size));
            }
            return chunks;
        }

        function renderCard(item) {
            const typeClass = item.type === 'critical' ? 'critical' : 'activity';
            const badgeClass = item.type === 'critical' ? 'badge-critical' : 'badge-activity';
            const badgeLabel = item.type === 'critical' ? 'Critical' : 'Activity';
            const linkId = item.id.split(' & ')[0].split(',')[0].trim();
            return `
            <div class="card ${typeClass}">
              <div class="card-top">
                <a href="https://deepdomain.atlassian.net/browse/${linkId}" target="_blank" class="card-id">${item.id}</a>
                <span class="card-badge ${badgeClass}">${badgeLabel}</span>
              </div>
              <div class="card-summary">${item.summary}</div>
              <div class="card-footer">
                <span class="label">Action</span>
                <span class="detail-text">${item.detail}</span>
                <span class="status-tag">${item.status}</span>
              </div>
            </div>
          `;
        }

        function renderSlides() {
            const perSlide = getItemsPerSlide();
            itemsPerSlide = perSlide;
            const chunks = chunkArray(allItems, perSlide);
            slides = chunks;

            track.innerHTML = chunks.map((chunk) => {
                const cardsHtml = chunk.map(item => renderCard(item)).join('');
                return `<div class="slider-slide"><div class="card-grid">${cardsHtml}</div></div>`;
            }).join('');

            dotsContainer.innerHTML = chunks.map((_, idx) =>
                `<button data-index="${idx}" class="${idx === 0 ? 'active' : ''}" aria-label="Go to slide ${idx+1}"></button>`
            ).join('');

            totalCountEl.textContent = allItems.length;
            updateSlide();
            updateButtons();
        }

        function updateSlide() {
            const total = slides.length;
            if (total === 0) return;
            if (currentIndex >= total) currentIndex = total - 1;
            if (currentIndex < 0) currentIndex = 0;

            track.style.transform = `translateX(-${currentIndex * 100}%)`;

            const dotBtns = dotsContainer.querySelectorAll('button');
            dotBtns.forEach((btn, idx) => {
                btn.classList.toggle('active', idx === currentIndex);
            });

            counterEl.textContent = `${currentIndex + 1} / ${total}`;
            updateButtons();
        }

        function updateButtons() {
            const total = slides.length;
            prevBtn.disabled = currentIndex === 0 || total === 0;
            nextBtn.disabled = currentIndex >= total - 1 || total === 0;
        }

        function goTo(index) {
            if (index < 0) index = 0;
            if (index >= slides.length) index = slides.length - 1;
            if (index === currentIndex) return;
            currentIndex = index;
            updateSlide();
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--;
                updateSlide(); }
        });
        nextBtn.addEventListener('click', () => {
            if (currentIndex < slides.length - 1) { currentIndex++;
                updateSlide(); }
        });

        dotsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const idx = parseInt(btn.dataset.index, 10);
            if (!isNaN(idx)) goTo(idx);
        });

        document.querySelector('.slider-section').addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault();
                prevBtn.click(); }
            if (e.key === 'ArrowRight') { e.preventDefault();
                nextBtn.click(); }
        });
        document.querySelector('.slider-section').setAttribute('tabindex', '0');

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const newPerSlide = getItemsPerSlide();
                if (newPerSlide !== itemsPerSlide) {
                    const oldIndex = currentIndex;
                    renderSlides();
                    if (oldIndex < slides.length) currentIndex = oldIndex;
                    else currentIndex = slides.length - 1;
                    updateSlide();
                }
            }, 200);
        });

        // ── set current date ──
        const now = new Date();
        document.getElementById('currentDate').textContent =
            now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

        // init
        renderSlides();
        console.log('✅ OOREDOO slider ready – 7 items, fits in viewport');
    </script>

</body>
</html>
